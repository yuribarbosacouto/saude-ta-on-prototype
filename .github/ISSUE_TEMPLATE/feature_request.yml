name: Feature request
description: Suggest a focused prototype improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user, admin, or privacy problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Users can...
        - Admins can...
        - No real personal data is required...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public site
        - Enrollment
        - Admin
        - Reports
        - Privacy
        - Documentation
        - Tooling
